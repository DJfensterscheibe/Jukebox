<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Songwunsch · HOST</title>
<script src="config.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || (window.SONGWUNSCH_CONFIG || {}).theme || "synthwave";</script>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden; height: 100vh; }
  .wrap { position: relative; z-index: 2; height: 100vh; display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 22px 24px; }

  body.demo .wrap { height: calc(100vh - 26px); }
  /* ---------- Hauptbereich ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { position: relative; z-index: 3; display: flex; align-items: baseline; gap: 22px; margin-bottom: 18px; flex-wrap: wrap; pointer-events: none; }
  .top h1 { margin: 0; font-size: clamp(22px, 2.6vw, 40px); letter-spacing: 3px; }
  .top .party { font-family: var(--pixel); font-size: 13px; letter-spacing: 2px; }
  .board { position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: -46px -30px 0; padding: 112px 40px 16px; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .tiles { --row: 118px; --col: 240px; display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(var(--col), 1fr)); grid-auto-rows: var(--row); grid-auto-flow: dense; }

  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
  .empty .big { font-family: var(--pixel); font-size: clamp(18px, 2.4vw, 34px); }
  .empty .small { font-size: 30px; color: #c7b5ef; }

  /* ---------- Song-Box: Retro-Spielmodul ---------- */
  .box { position: relative; grid-column: span 1; grid-row: span 1; cursor: pointer; contain: layout style; }
  .box.s2 { grid-column: span 2; }
  .box.s3 { grid-column: span 2; grid-row: span 2; }
  .box.s4 { grid-column: span 3; grid-row: span 2; }

  /* Gehäuse */
  .face { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 17px 8px 11px; color: var(--ink);
    background: linear-gradient(180deg, rgba(255,255,255,.16), transparent 30%, rgba(0,0,0,.18)), var(--body);
    border-radius: 8px 8px 4px 4px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -7px 0 rgba(0,0,0,.35), inset 3px 0 0 rgba(255,255,255,.08),
      0 8px 0 rgba(0,0,0,.45), 0 0 22px var(--glow); }
  /* Griffrillen oben */
  .face::before { content: ""; position: absolute; top: 5px; left: 16%; right: 16%; height: 8px;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0 3px, rgba(255,255,255,.12) 3px 4px, transparent 4px 8px); border-radius: 2px; }
  /* Kerben unten */
  .face .notch { position: absolute; bottom: 3px; width: 18px; height: 5px; background: rgba(0,0,0,.45); border-radius: 2px 2px 0 0; }
  .face .notch.l { left: 12px; } .face .notch.r { right: 12px; }

  /* Etikett */
  .label { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
    padding: 15px 12px 5px; background: var(--label); border-radius: 4px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.2); }
  /* 80er-Streifen oben auf dem Etikett */
  .label::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px;
    background: linear-gradient(90deg, #ffe45e 0 20%, #ff8a3d 20% 40%, #ff2fb9 40% 60%, #9d4dff 60% 80%, #2de2ff 80%); opacity: .95; }
  .label .tag { position: absolute; top: 9px; left: 11px; font-family: var(--pixel); font-size: 7px; letter-spacing: 1px; opacity: .7; z-index: 3; }
  .label .title { position: relative; z-index: 3; font-family: var(--term); font-size: var(--fs, 34px); line-height: .95; margin-top: 4px;
    overflow-wrap: normal; word-break: normal; }
  .label .title, .label .artist { flex: none; }
  .label .artist { position: relative; z-index: 3; font-size: calc(var(--fs, 34px) * .55); opacity: .78; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box.s3 .face, .box.s4 .face { padding: 26px 14px 18px; }
  .box.s3 .face::before, .box.s4 .face::before { top: 8px; height: 11px; }
  .box.s3 .label, .box.s4 .label { padding: 18px 22px 12px; }
  .box.s3 .label .tag, .box.s4 .label .tag { font-size: 10px; top: 14px; left: 18px; }
  .box.s3 .label::before, .box.s4 .label::before { height: 9px; }

  /* Münze mit Anzahl */
  .badge { position: absolute; z-index: 6; top: -22px; right: -16px; width: 58px; height: 58px; pointer-events: none; }
  .badge[hidden] { display: none; }
  .coin { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    display: flex; align-items: baseline; justify-content: center; padding-top: 17px; gap: 1px;
    font-family: var(--pixel); color: #5a3300; text-shadow: 1px 1px 0 rgba(255,255,255,.55);
    background: radial-gradient(circle at 35% 28%, #fffbd0 0 14%, #ffd23f 42%, #e09a00 78%, #a86a00 100%);
    border: 3px solid #7a4600; box-shadow: 0 4px 0 #4a2800, inset 0 0 0 3px rgba(255,255,255,.35);
    animation: wobble 1.8s ease-in-out infinite alternate; will-change: transform; }
  .coin .bx { font-size: 10px; }
  .coin .bn { font-size: 18px; }
  /* Glanzstreifen, der über die Münze huscht */
  .coin::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 35%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); transform: translateX(0) rotate(20deg);
    animation: shine 2.6s ease-in-out infinite; will-change: transform; }
  @keyframes wobble { from { transform: rotate(-10deg) scale(1); } to { transform: rotate(10deg) scale(1.08); } }
  @keyframes shine { 0%, 55% { transform: translateX(0) rotate(20deg); } 100% { transform: translateX(560%) rotate(20deg); } }
  /* Strahlenkranz hinter der Münze */
  .rays { position: absolute; inset: -18px; border-radius: 50%; z-index: -1; opacity: .75;
    background: repeating-conic-gradient(from 0deg, rgba(255,228,94,.85) 0 10deg, transparent 10deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 38%, #000 40%, #000 62%, transparent 72%);
            mask: radial-gradient(circle, transparent 38%, #000 40%, #000 62%, transparent 72%);
    animation: spin 6s linear infinite; will-change: transform; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Größere Boxen = größere Münze */
  .box.s3 .badge, .box.s4 .badge { width: 78px; height: 78px; top: -30px; right: -22px; }
  .box.s3 .coin, .box.s4 .coin { padding-top: 23px; border-width: 4px; }
  .box.s3 .coin .bx, .box.s4 .coin .bx { font-size: 13px; }
  .box.s3 .coin .bn, .box.s4 .coin .bn { font-size: 26px; }
  /* Ab Flammen: glühende Feuer-Münze */
  .box.fire .coin { color: #fff; text-shadow: 2px 2px 0 #7a0016;
    background: radial-gradient(circle at 35% 28%, #fff4b0 0 12%, #ffb13d 35%, #ff3d3d 70%, #8a0020 100%);
    border-color: #5a0010; box-shadow: 0 4px 0 #3a000a, inset 0 0 0 3px rgba(255,255,255,.3), 0 0 22px rgba(255,80,20,.9);
    animation-duration: .9s; }
  .box.fire .rays { background: repeating-conic-gradient(from 0deg, rgba(255,120,30,.95) 0 12deg, rgba(255,228,94,.6) 12deg 18deg, transparent 18deg 30deg);
    animation-duration: 2.5s; inset: -26px; opacity: 1; }
  .box.s4 .badge { width: 92px; height: 92px; top: -36px; right: -26px; }
  .box.s4 .coin { padding-top: 27px; } .box.s4 .coin .bn { font-size: 32px; }
  /* Neue Stimme: Münze springt und dreht sich */
  .box.bump .badge { animation: coinpop .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes coinpop { 0% { transform: scale(1) rotateY(0); } 40% { transform: scale(1.7) rotateY(180deg); } 100% { transform: scale(1) rotateY(360deg); } }

  /* Varianten: Gehäusefarbe + Etikett */
  .th0 { --body: #3a3550; --label: linear-gradient(180deg, #ffe45e, #ff8a3d 55%, #ff2fb9); --ink: #2a0849; --glow: rgba(255,47,185,.35); }
  .th1 { --body: #6c2bd9; --label: #0b0221; --ink: #2de2ff; --glow: rgba(157,77,255,.45); }
  [data-theme="synthwave"] .th1 .label { background-image: linear-gradient(rgba(45,226,255,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(45,226,255,.13) 1px, transparent 1px); background-size: 16px 16px; }
  [data-theme="synthwave"] .th1 .title { text-shadow: 0 0 8px rgba(45,226,255,.7); }
  .th2 { --body: #ff2fb9; --label: #fff3d6; --ink: #2a0849; --glow: rgba(255,47,185,.45); }
  .th3 { --body: #17a9cc; --label: #0d1b6e; --ink: #ffe45e; --glow: rgba(45,226,255,.4); }
  [data-theme="synthwave"] .th3 .title { text-shadow: 2px 2px 0 #ff2fb9; }
  .th4 { --body: #ff9a2e; --label: #1a0638; --ink: #ff6fd0; --glow: rgba(255,138,61,.45); }
  [data-theme="synthwave"] .th4 .title { text-shadow: 0 0 8px rgba(255,47,185,.7); }
  .th5 { --body: #a7abbd; --label: #111; --ink: #fff; --glow: rgba(200,210,255,.3); }
  [data-theme="synthwave"] .th5 .title { background: linear-gradient(180deg, #fff 0%, #b3f3ff 45%, #2de2ff 50%, #ff8fe0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .th6 { --body: #1f9e64; --label: #031a0c; --ink: #39ff88; --glow: rgba(57,255,136,.35); }
  [data-theme="synthwave"] .th6 .title::before { content: "> "; }
  [data-theme="synthwave"] .th6 .label { background-image: repeating-linear-gradient(180deg, rgba(57,255,136,.07) 0 2px, transparent 2px 4px); }
  .th7 { --body: #e8344e; --label: #f4ecff; --ink: #1a0638; --glow: rgba(255,77,109,.4); }

  /* Animationen (nur transform/opacity = flüssig) */
  .box.new { animation: spawn .55s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes spawn { 0% { transform: translateY(-40px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .box.new .face::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #fff; animation: flash .45s ease-out forwards; z-index: 7; pointer-events: none; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .box.bump { animation: bump .45s ease-out; }
  @keyframes bump { 30% { transform: scale(1.06); } 100% { transform: none; } }
  .plusone { position: absolute; z-index: 9; right: 30px; top: 8px; font-family: var(--pixel); font-size: 20px; color: var(--yellow);
    text-shadow: 2px 2px 0 var(--pink); animation: floatup 1.1s ease-out forwards; pointer-events: none; will-change: transform, opacity; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }
  .box.bye { animation: bye .4s ease-in forwards; }
  @keyframes bye { 40% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(.2); opacity: 0; } }

  /* ---------- Flammen ---------- */
  :root { --fl1: #b0002a; --fl2: #ff2f4a; --fl3: #ff6a2a; --fl4: #ff9d3d; --fl5: #ffe45e; --fl6: #fffbd0;
    --heat1: rgba(255,140,30,.7); --heat2: rgba(255,40,60,.35); --heat3: rgba(255,80,20,.6);
    --em1: rgba(255,240,140,.9); --em2: rgba(255,140,40,.6); --em3: rgba(255,40,80,.28); }
  [data-theme="gameboy"] { --fl1: #0f380f; --fl2: #0f380f; --fl3: #306230; --fl4: #8bac0f; --fl5: #9bbc0f; --fl6: #c4dc5a;
    --heat1: rgba(155,188,15,.6); --heat2: rgba(48,98,48,.4); --heat3: rgba(155,188,15,.45);
    --em1: rgba(196,220,90,.8); --em2: rgba(139,172,15,.5); --em3: rgba(48,98,48,.3); }
  .box.fire .face { --glow: rgba(255, 110, 30, .9); }
  /* pulsierendes Glühen: fester Schatten, nur Deckkraft animiert */
  .heat { position: absolute; inset: -18px -14px -10px; border-radius: 18px; z-index: -1; pointer-events: none; display: none;
    background: radial-gradient(ellipse at 50% 70%, var(--heat1), var(--heat2) 55%, transparent 78%);
    box-shadow: 0 0 50px 18px var(--heat3); animation: heat .7s ease-in-out infinite alternate; will-change: opacity; }
  .box.fire .heat { display: block; }
  @keyframes heat { from { opacity: .45; } to { opacity: 1; } }
  /* Glut im Etikett */
  .embers { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .embers i { position: absolute; bottom: -35%; width: 28%; height: 85%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 85%, var(--em1) 0%, var(--em2) 28%, var(--em3) 50%, transparent 68%);
    animation: rise 1.1s ease-in infinite; opacity: 0; will-change: transform, opacity; }
  @keyframes rise { 0% { transform: translate3d(0, 20%, 0) scale(1); opacity: 0; } 20% { opacity: .95; }
    100% { transform: translate3d(0, -80%, 0) scale(.35); opacity: 0; } }
  /* Flammenzungen oben (zwei Ebenen) + an den Seiten */
  .flames { position: absolute; inset: 0; pointer-events: none; display: none; }
  .box.fire .flames { display: block; }
  .tongues { position: absolute; left: 2%; right: 2%; top: -80px; height: 92px; z-index: 4; }
  .tongues.back { top: -104px; height: 116px; left: -3%; right: -3%; z-index: 3; opacity: .85; }
  .tongues.side-l, .tongues.side-r { top: 8%; bottom: 8%; height: auto; width: 46px; left: auto; right: auto; z-index: 3; }
  .tongues.side-l { left: -34px; }
  .tongues.side-r { right: -34px; }
  .tongues b { position: absolute; bottom: 0; width: 13%; height: 100%;
    background: linear-gradient(0deg, var(--fl2) 0%, var(--fl3) 25%, var(--fl4) 50%, var(--fl5) 78%, var(--fl6) 92%, transparent 100%);
    clip-path: polygon(50% 0, 66% 28%, 84% 18%, 92% 55%, 100% 100%, 0 100%, 8% 52%, 18% 24%, 34% 36%);
    transform-origin: 50% 100%; animation: lick .42s steps(3) infinite alternate; will-change: transform; }
  .tongues.back b { background: linear-gradient(0deg, var(--fl1) 0%, var(--fl2) 35%, var(--fl3) 70%, transparent 100%); width: 15%; }
  .tongues.side-l b, .tongues.side-r b { width: 100%; height: 28%; left: 0 !important;
    background: linear-gradient(90deg, transparent, var(--fl5) 20%, var(--fl4) 55%, var(--fl2) 100%);
    clip-path: polygon(0 50%, 30% 20%, 45% 35%, 100% 0, 100% 100%, 45% 65%, 30% 80%);
    transform-origin: 100% 50%; animation-name: licks; }
  .tongues.side-r b { background: linear-gradient(270deg, transparent, var(--fl5) 20%, var(--fl4) 55%, var(--fl2) 100%);
    clip-path: polygon(100% 50%, 70% 20%, 55% 35%, 0 0, 0 100%, 55% 65%, 70% 80%); transform-origin: 0 50%; }
  @keyframes lick { 0% { transform: scaleY(.5) skewX(-8deg); } 100% { transform: scaleY(1.1) skewX(8deg); } }
  @keyframes licks { 0% { transform: scaleX(.45); } 100% { transform: scaleX(1.05); } }
  /* Funken, die nach oben fliegen */
  .sparks { position: absolute; left: 0; right: 0; top: 0; height: 0; z-index: 5; }
  .sparks s { position: absolute; top: 0; width: 6px; height: 6px; background: var(--fl5); box-shadow: 0 0 6px var(--fl4);
    animation: spark 1.6s ease-out infinite; opacity: 0; will-change: transform, opacity; }
  .sparks s:nth-child(3n) { background: var(--fl6); width: 4px; height: 4px; }
  .sparks s:nth-child(4n) { background: var(--fl3); }
  @keyframes spark { 0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0; } 10% { opacity: 1; }
    100% { transform: translate3d(var(--dx, 0), -170px, 0) scale(.3) rotate(180deg); opacity: 0; } }
  /* Große Feuer-Boxen: noch mehr */
  .box.s3.fire .tongues, .box.s4.fire .tongues { top: -110px; height: 124px; }
  .box.s3.fire .tongues.back, .box.s4.fire .tongues.back { top: -142px; height: 156px; }
  .box.s4.fire .tongues b { animation-duration: .32s; }
  .box.s4.fire .heat { box-shadow: 0 0 80px 30px var(--heat3); }

  /* ============ BOXEN IM DESIGN "ARCADE": Automaten-Leuchttafeln ============ */
  [data-theme="arcade"] .face { background: #000; border-radius: 2px; padding: 8px; color: var(--a1);
    box-shadow: 0 0 0 4px var(--a1), 0 0 0 8px #000, 0 0 0 11px var(--a2), 0 0 26px var(--a1); }
  [data-theme="arcade"] .face::before, [data-theme="arcade"] .notch, [data-theme="arcade"] .label::before { display: none; }
  [data-theme="arcade"] .label { background: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px); box-shadow: none; padding: 18px 12px 6px; border-radius: 0; }
  [data-theme="arcade"] .label .tag { color: #fff; opacity: .9; }
  [data-theme="arcade"] .label .title { font-family: var(--pixel); font-size: calc(var(--fs, 34px) * .52); line-height: 1.3; color: var(--a1); text-shadow: 3px 3px 0 var(--a3); }
  [data-theme="arcade"] .label .artist { color: #fff; opacity: .75; font-size: calc(var(--fs, 34px) * .62); margin-top: 6px; }
  [data-theme="arcade"] .th0 { --a1: #ffe14d; --a2: #ff3b5c; --a3: #8a1f00; }
  [data-theme="arcade"] .th1 { --a1: #3bd5ff; --a2: #3b5bff; --a3: #0b1a6e; }
  [data-theme="arcade"] .th2 { --a1: #ff3b5c; --a2: #ffe14d; --a3: #5a0018; }
  [data-theme="arcade"] .th3 { --a1: #4dff6a; --a2: #3b5bff; --a3: #0a4a16; }
  [data-theme="arcade"] .th4 { --a1: #ff6ae0; --a2: #3bd5ff; --a3: #5a0a4a; }
  [data-theme="arcade"] .th5 { --a1: #ff9d2e; --a2: #ffe14d; --a3: #6a2a00; }
  [data-theme="arcade"] .th6 { --a1: #ffffff; --a2: #ff3b5c; --a3: #3b5bff; }
  [data-theme="arcade"] .th7 { --a1: #b48cff; --a2: #4dff6a; --a3: #2a0a6e; }
  [data-theme="arcade"] .box.fire .face { box-shadow: 0 0 0 4px #ff9d2e, 0 0 0 8px #000, 0 0 0 11px #ff3b5c, 0 0 30px #ff6a2a; }

  /* ============ BOXEN IM DESIGN "VAPORWAVE": Retro-Fenster ============ */
  [data-theme="vapor"] .face { background: #c0c0c0; border-radius: 0; padding: 30px 6px 6px; color: var(--vink);
    box-shadow: inset -2px -2px 0 #404040, inset 2px 2px 0 #fff, inset -4px -4px 0 #808080, inset 4px 4px 0 #dfdfdf, 7px 7px 0 rgba(26,15,51,.5); }
  [data-theme="vapor"] .face::before { top: 5px; left: 5px; right: 5px; height: 21px; border-radius: 0; background: linear-gradient(90deg, var(--bar1), var(--bar2)); }
  [data-theme="vapor"] .notch.l { display: none; }
  [data-theme="vapor"] .notch.r { top: 7px; bottom: auto; right: 9px; width: auto; height: auto; background: none; z-index: 4; }
  [data-theme="vapor"] .notch.r::after { content: "_ □ ×"; color: #fff; font-family: var(--term); font-size: 18px; letter-spacing: 3px; }
  [data-theme="vapor"] .label { position: static; background: var(--paper); border-radius: 0; padding: 8px 12px; box-shadow: inset 2px 2px 0 #808080, inset -2px -2px 0 #fff; }
  [data-theme="vapor"] .label::before { display: none; }
  [data-theme="vapor"] .label .tag { top: 10px; left: 12px; color: #fff; opacity: 1; z-index: 5; }
  [data-theme="vapor"] .label .tag::after { content: ".MP3"; }
  [data-theme="vapor"] .box.s3 .label .tag, [data-theme="vapor"] .box.s4 .label .tag { top: 11px; left: 12px; font-size: 9px; }
  [data-theme="vapor"] .box.s3 .face, [data-theme="vapor"] .box.s4 .face { padding: 32px 8px 8px; }
  [data-theme="vapor"] .box.s3 .face::before, [data-theme="vapor"] .box.s4 .face::before { top: 5px; height: 23px; }
  [data-theme="vapor"] .label .title { color: var(--vink); }
  [data-theme="vapor"] .th0 { --bar1: #000080; --bar2: #1084d0; --paper: #fff; --vink: #000080; }
  [data-theme="vapor"] .th1 { --bar1: #ff71ce; --bar2: #b967ff; --paper: #fff0fa; --vink: #5a1a6e; }
  [data-theme="vapor"] .th2 { --bar1: #01cdfe; --bar2: #05ffa1; --paper: #effffa; --vink: #00506a; }
  [data-theme="vapor"] .th3 { --bar1: #b967ff; --bar2: #01cdfe; --paper: #fffde0; --vink: #3a1a7a; }
  [data-theme="vapor"] .th4 { --bar1: #ff71ce; --bar2: #fffb96; --paper: #fff; --vink: #b0006a; }
  [data-theme="vapor"] .th5 { --bar1: #241446; --bar2: #b967ff; --paper: #f3ecff; --vink: #241446; }
  [data-theme="vapor"] .th6 { --bar1: #008080; --bar2: #05ffa1; --paper: #fff; --vink: #005050; }
  [data-theme="vapor"] .th7 { --bar1: #1084d0; --bar2: #ff71ce; --paper: #fff8e8; --vink: #000080; }
  [data-theme="vapor"] .box.fire .face { --bar1: #b0002a; --bar2: #ff9d3d; }

  /* ============ BOXEN IM DESIGN "POCKET 8-BIT": RPG-Dialogfenster ============ */
  [data-theme="gameboy"] .face { background: var(--gb-bg); border-radius: 10px; padding: 7px; color: var(--gb-ink);

  [data-theme="gameboy"] .coin { color: #0f380f; text-shadow: none; background: radial-gradient(circle at 35% 30%, #c4dc5a 0 18%, #9bbc0f 45%, #8bac0f 100%); border-color: #0f380f; box-shadow: 0 4px 0 #071d07; }
  [data-theme="gameboy"] .rays { background: repeating-conic-gradient(from 0deg, rgba(155,188,15,.9) 0 10deg, transparent 10deg 30deg); }

  /* Gespielt-Bestätigung */

  /* ---------- Seitenleiste ---------- */

  .qrbox .stat b { font-size: 12px; font-weight: normal; }

  /* ---------- Rangliste "Meistgespielt" ----------
     Bewusst KEIN Spielmodul-Look: offene Highscore-Tafel */
  .rank { flex: 1; min-height: 120px; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 46px;
    padding: 14px 6px 10px; border-top: 3px double var(--yellow); border-bottom: 3px double var(--yellow);

  .rank-head { text-align: center; margin-bottom: 10px; }

  .rank-sub { display: block; font-family: var(--pixel); font-size: 7px; letter-spacing: 2px; margin-top: 7px; color: var(--cyan); opacity: .85; }
  .rank-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
  .r { display: flex; align-items: center; gap: 8px; padding: 4px 6px; line-height: 1; }
  .r:nth-child(odd) { background: rgba(255,255,255,.05); }
  .r .pos { flex: none; width: 34px; font-family: var(--pixel); font-size: 9px; color: var(--cyan); }

  .r.up { animation: rowup 1.4s ease-out; }
  @keyframes rowup { 0% { transform: translateX(-14px); opacity: .2; } 30% { transform: translateX(4px); opacity: 1; } 100% { transform: none; } }
  .r.up .ct { animation: blink .25s steps(1) 5; }
  .rank-empty { text-align: center; font-size: 20px; opacity: .65; padding: 10px 6px; line-height: 1.1; }

  /* ---------- Steuerung: eingeklappt unten rechts ---------- */
  .ctrl { position: absolute; right: 0; bottom: 0; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .ctrl .gear { width: 38px; height: 38px; font-size: 20px; line-height: 1; border: 2px solid var(--purple); background: rgba(17,4,40,.85);
    color: #fff; cursor: pointer; opacity: .45; transition: opacity .2s; padding: 0; }

  .ctrl .panel { display: none; flex-direction: column; gap: 8px; width: 300px; padding: 12px; background: rgba(7,1,26,.95); border: 2px solid var(--purple); }

  .ctrl .help { font-size: 18px; color: #c7b5ef; text-align: center; line-height: 1; }

  .ctrl .panel button:hover { border-color: var(--cyan); }

  [data-theme="arcade"] .r:nth-child(5) * { color: #ff9d2e; } [data-theme="arcade"] .r:nth-child(n+6) * { color: #c9c9ff; }

  [data-theme="vapor"] .rank { background: #c0c0c0; color: #1a0f33; border: 0; padding: 34px 8px 8px; position: relative;
    box-shadow: inset -2px -2px 0 #404040, inset 2px 2px 0 #fff, inset -4px -4px 0 #808080, inset 4px 4px 0 #dfdfdf, 8px 8px 0 rgba(26,15,51,.55); }
  [data-theme="vapor"] .rank::before { content: "♫ TOP_HITS.TXT"; position: absolute; top: 5px; left: 5px; right: 5px; height: 22px; line-height: 22px; padding-left: 8px;
    background: linear-gradient(90deg, #ff71ce, #b967ff); color: #fff; font-family: var(--pixel); font-size: 9px; }
  [data-theme="vapor"] .rank-head { background: #fff; margin: 0 0 6px; padding: 8px 4px; box-shadow: inset 2px 2px 0 #808080; }

  [data-theme="vapor"] .rank-sub { color: #b967ff; }

  [data-theme="vapor"] .r:nth-child(odd) { background: #f2e9ff; }
  [data-theme="vapor"] .r .nm { color: #1a0f33; } [data-theme="vapor"] .r1 .nm { color: #000080; }
  [data-theme="vapor"] .r .pos { color: #b967ff; } [data-theme="vapor"] .r1 .pos { color: #ff3fb8; }
  [data-theme="vapor"] .r .ct { color: #000080; }
  [data-theme="vapor"] .rank-empty { color: #1a0f33; }

  [data-theme="gameboy"] .rank { background: #9bbc0f; color: #0f380f; border: 4px solid #0f380f; border-radius: 10px; padding: 16px 10px 10px;
    box-shadow: inset 0 0 0 3px #9bbc0f, inset 0 0 0 6px #306230, 6px 6px 0 #071d07; }
  [data-theme="gameboy"] .rank-title, [data-theme="gameboy"] .rank-sub { color: #0f380f; text-shadow: none; }
  [data-theme="gameboy"] .r { background: none !important; }
  [data-theme="gameboy"] .r .nm, [data-theme="gameboy"] .r .ct { color: #0f380f; }
  [data-theme="gameboy"] .r .pos { color: #306230; }
  [data-theme="gameboy"] .r1 .pos::before { content: "▶"; animation: blink .8s steps(1) infinite; }
  [data-theme="gameboy"] .r1 .pos { color: #0f380f; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    .wrap { grid-template-columns: 1fr; height: auto; }
    .board { overflow: visible; }

    .box.s4 { grid-column: span 2; }

</style>

<body>
<div class="scene"><div class="stars"></div><div class="sun"></div><div class="horizon"></div><div class="grid"></div></div>
<div class="crt"></div>

<div class="wrap">
  <section class="stage">
    <div class="top">
      <h1 class="chrome" id="title">★ SONG REQUESTS ★</h1>
    </div>
    <div class="board" id="board">
      <div class="tiles" id="tiles"></div>
      <div class="empty" id="empty">
        <div class="big neon-p">WAITING FOR PLAYERS<span class="blink">_</span></div>
        <div class="small">QR-Code scannen und den ersten Song wünschen!</div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="qrbox pixel-box">
      <div class="scan neon-y">SCAN ME!</div>
      <div class="qr" id="qr"></div>
      <div class="cta neon-c">SONG WÜNSCHEN · OHNE ANMELDUNG</div>
      <div class="url" id="url"></div>
      <div class="stat neon-p"><b id="nReq">0</b> WÜNSCHE · <b id="nSongs">0</b> SONGS</div>
    </div>
    <section class="rank" id="rank">
      <div class="rank-head"><span class="rank-title">🏆 MEISTGESPIELT</span><span class="rank-sub">SO OFT HEUTE GESPIELT</span></div>
      <ol class="rank-list" id="rankList"></ol>
    </section>
    <div class="ctrl" id="ctrl">
      <div class="panel">
        <div class="help">Box anklicken = als gespielt abhaken</div>
        <button id="fs" type="button">⛶ VOLLBILD</button>
        <button id="fx" type="button">⚡ EFFEKTE: AUTO</button>
        <button id="resetRank" type="button">🏆 RANGLISTE LÖSCHEN</button>
        <button id="reset" type="button">↺ ALLE WÜNSCHE LÖSCHEN</button>
      </div>
      <button class="gear" type="button" aria-label="Einstellungen">⚙</button>
    </div>
  </aside>
</div>

<script src="qrcode.js"></script>
<script type="module">
import { config, initBackend, clusterRequests, playedKeyFor, hash, esc } from "./app.js";

const $ = id => document.getElementById(id);
$("title").textContent = "★ " + config.partyName + " ★";

// ---------- QR-Code zur Gäste-Seite ----------
const guestUrl = new URL("./", location.href).href;
$("url").textContent = guestUrl.replace(/^https?:\/\//, "").replace(/\/$/, "");
try {
  const qr = qrcode(0, "M");
  qr.addData(guestUrl);
  qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
} catch (e) { $("qr").textContent = "QR-Fehler"; }

// ---------- Zustand ----------
const tiles = $("tiles");
const nodes = new Map();          // cluster-id -> { el, count, sig }
let current = [];
let played = [];
let backend = null;
let firstRender = true;
let layoutSig = "";

function sizeClass(n) {
  if (n >= 8) return "s4";
  if (n >= 3) return "s3";
  if (n === 2) return "s2";
  return "s1";
}

function makeBox(c) {
  const el = document.createElement("div");
  el.className = "box";
  el.dataset.id = c.id;
  el.innerHTML = `<div class="heat"></div>
    <div class="flames"><div class="tongues back"></div><div class="tongues side-l"></div><div class="tongues side-r"></div><div class="tongues front"></div><div class="sparks"></div></div>
    <div class="face"><div class="label"><div class="embers"></div><div class="tag"></div><div class="title"></div><div class="artist"></div></div><span class="notch l"></span><span class="notch r"></span></div>
    <div class="badge" hidden><div class="rays"></div><div class="coin"><span class="bx">x</span><span class="bn"></span></div></div>`;
  const fill = (sel, n, fn) => { const box = el.querySelector(sel); for (let i = 0; i < n; i++) { const e = document.createElement(sel === ".sparks" ? "s" : "b"); fn(e, i, n); box.appendChild(e); } };
  const flick = (e, i) => { e.style.animationDelay = (-(i * 0.13) % 0.42).toFixed(2) + "s"; e.style.animationDuration = (0.32 + (i % 4) * 0.07).toFixed(2) + "s"; };
  fill(".tongues.back", 6, (e, i, n) => { e.style.left = (i * (100 / n) - 2) + "%"; flick(e, i + 3); });
  fill(".tongues.front", 10, (e, i, n) => { e.style.left = (i * (100 / n) - 1) + "%"; flick(e, i); });
  fill(".tongues.side-l", 4, (e, i) => { e.style.top = (i * 25) + "%"; flick(e, i + 1); });
  fill(".tongues.side-r", 4, (e, i) => { e.style.top = (i * 25) + "%"; flick(e, i + 2); });
  fill(".sparks", 10, (e, i) => {
    e.style.left = (4 + (i * 37) % 92) + "%";
    e.style.setProperty("--dx", (((i * 53) % 80) - 40) + "px");
    e.style.animationDelay = ((i * 0.23) % 1.6).toFixed(2) + "s";
    e.style.animationDuration = (1.2 + (i % 5) * 0.18).toFixed(2) + "s";
  });
  const em = el.querySelector(".embers");
  for (let i = 0; i < 8; i++) {
    const s = document.createElement("i");
    s.style.left = (i * 13 - 8) + "%";
    s.style.animationDelay = (i * 0.23 % 1.1).toFixed(2) + "s";
    s.style.animationDuration = (0.9 + (i % 4) * 0.15).toFixed(2) + "s";
    em.appendChild(s);
  }
  el._q = {                         // Elemente merken statt jedes Mal zu suchen
    tag: el.querySelector(".tag"), title: el.querySelector(".title"), artist: el.querySelector(".artist"),
    badge: el.querySelector(".badge"), bn: el.querySelector(".coin .bn"), embers: em, label: el.querySelector(".label")
  };
  el.addEventListener("click", ev => onBoxClick(el, ev));
  return el;
}

// Aktualisiert eine Box – fasst das DOM nur an, wenn sich etwas geändert hat
function updateBox(el, c, rank) {
  const q = el._q;
  const fire = c.count >= config.flameAt;
  const cls = `box th${hash(c.id) % 8} ${sizeClass(c.count)}${fire ? " fire" : ""}`;
  if (el._cls !== cls) {
    const keep = ["new", "bump", "bye"].filter(k => el.classList.contains(k));
    el.className = cls + (keep.length ? " " + keep.join(" ") : "");
    el._cls = cls;
  }
  const tag = (fire ? "🔥 ON FIRE · " : "") + "TRACK " + String(rank).padStart(2, "0");
  if (q.tag.textContent !== tag) q.tag.textContent = tag;
  if (q.title.textContent !== c.label) q.title.textContent = c.label;
  const art = c.artist || "";
  if (q.artist.textContent !== art) { q.artist.textContent = art; q.artist.hidden = !art; el._fit = ""; }
  q.badge.hidden = c.count < 2;
  if (q.bn.textContent !== String(c.count)) q.bn.textContent = c.count;
  q.embers.hidden = !fire;
}

function render(list) {
  current = list;
  $("empty").style.display = list.length ? "none" : "flex";
  $("nReq").textContent = list.reduce((s, c) => s + c.count, 0);
  $("nSongs").textContent = list.length;

  const seen = new Set();
  list.forEach((c, i) => {
    seen.add(c.id);
    let n = nodes.get(c.id);
    if (!n) {
      const el = makeBox(c);
      if (!firstRender) { el.classList.add("new"); setTimeout(() => el.classList.remove("new"), 700); }
      n = { el, count: c.count };
      nodes.set(c.id, n);
    } else if (c.count > n.count) {
      n.el.classList.remove("bump"); void n.el.offsetWidth; n.el.classList.add("bump");
      setTimeout(() => n.el.classList.remove("bump"), 750);
      const p = document.createElement("div");
      p.className = "plusone"; p.textContent = "+" + (c.count - n.count);
      n.el.appendChild(p); setTimeout(() => p.remove(), 1200);
    }
    n.count = c.count;
    updateBox(n.el, c, i + 1);
  });
  for (const [id, n] of nodes) if (!seen.has(id)) { n.el.remove(); nodes.delete(id); }

  // Reihenfolge per CSS "order" statt Boxen umzuhängen –
  // so laufen Flammen & Münzen beim Umsortieren einfach weiter
  list.forEach((c, i) => {
    const el = nodes.get(c.id).el;
    if (el.style.order !== String(i)) el.style.order = i;
    if (!el.isConnected) tiles.appendChild(el);
  });
  firstRender = false;

  // Größen nur neu berechnen, wenn sich das Layout geändert hat
  const sig = list.map(c => c.id + ":" + sizeClass(c.count)).join("|");
  if (sig !== layoutSig) { layoutSig = sig; fit(); }
  else fitAll(false);
}

// Schriftgröße pro Box (Binärsuche statt Schritt für Schritt)
function fitText(el, force) {
  const q = el._q;
  const sig = el._cls + "|" + q.title.textContent + "|" + q.artist.textContent + "|" + tiles.style.getPropertyValue("--row") + "|" + tiles.style.getPropertyValue("--col") + "|" + innerWidth + "x" + innerHeight;
  if (!force && el._fit === sig) return;
  el._fit = sig;
  const set = fs => { q.title.style.setProperty("--fs", fs + "px"); q.artist.style.setProperty("--fs", fs + "px"); };
  const over = () => q.label.scrollHeight > q.label.clientHeight + 1 || q.title.scrollWidth > q.title.clientWidth + 1;
  // Größte Schrift suchen, die noch komplett in die Box passt (Binärsuche)
  const max = Math.max(16, Math.min(170, Math.floor(q.label.clientHeight * 0.9)));
  const search = () => {
    set(max);
    if (!over()) return max;
    let lo = 12, hi = max;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; set(mid); if (over()) hi = mid; else lo = mid; }
    set(lo);
    return lo;
  };
  const hasArtist = !!q.artist.textContent;
  if (!hasArtist) { q.artist.hidden = true; search(); return; }
  // Mit und ohne Künstlerzeile probieren: Künstler nur zeigen, wenn der Titel dadurch groß genug bleibt
  q.artist.hidden = true;
  const without = search();
  q.artist.hidden = false;
  const withArtist = search();
  if (withArtist < without * 0.72) { q.artist.hidden = true; set(without); }
}
function fitAll(force) { for (const n of nodes.values()) fitText(n.el, force); }

// Wenn es zu viele Boxen werden: alles etwas kleiner machen
function fit() {
  const board = $("board");
  if (window.innerWidth <= 900) { fitAll(true); return; }
  const cs = getComputedStyle(board);
  const avail = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 10;
  const steps = [[118, 240], [100, 210], [86, 180], [74, 160], [64, 140]];
  for (const [r, c] of steps) {
    tiles.style.setProperty("--row", r + "px");
    tiles.style.setProperty("--col", c + "px");
    if (tiles.scrollHeight <= avail) break;
  }
  fitAll(false);
}
document.fonts && document.fonts.ready.then(() => { layoutSig = ""; fit(); fitAll(true); renderRanking(); });
let rsT = null;
window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { fit(); fitAll(true); renderRanking(); }, 150); });

// ---------- Rangliste "Meistgespielt" ----------
let lastCounts = new Map();
let firstRanking = true;
function renderRanking() {
  const ol = $("rankList");
  const top = [...played].filter(p => p.count > 0).sort((a, b) => b.count - a.count || a.label.localeCompare(b.label)).slice(0, 10);
  if (!top.length) {
    ol.innerHTML = `<li class="rank-empty">Noch nichts gespielt.<br>Hak einen Song ab, dann geht's los!</li>`;
    return;
  }
  const pos = i => ["1ST", "2ND", "3RD"][i] || (i + 1) + "TH";
  ol.innerHTML = top.map((p, i) => {
    const up = lastCounts.has(p.key) ? p.count > lastCounts.get(p.key) : !firstRanking;
    return `<li class="r r${i + 1}${up ? " up" : ""}"><span class="pos">${pos(i)}</span><span class="nm">${esc(p.label)}${p.artist ? `<small>${esc(p.artist)}</small>` : ""}</span><span class="ct">${p.count}×</span></li>`;
  }).join("");
  lastCounts = new Map(played.map(p => [p.key, p.count]));
  firstRanking = false;
  // So viele Plätze zeigen, wie gut lesbar hineinpassen (max. 10)
  const panel = $("rank");
  while (ol.children.length > 3 && panel.scrollHeight > panel.clientHeight + 1) ol.lastElementChild.remove();
}

// ---------- Gespielt markieren ----------
function onBoxClick(el, ev) {
  if (ev.target.closest(".confirm")) return;
  document.querySelectorAll(".confirm").forEach(c => c.remove());
  const c = current.find(x => x.id === el.dataset.id);
  if (!c) return;
  const ov = document.createElement("div");
  ov.className = "confirm";
  ov.innerHTML = `<span>GESPIELT?</span><button class="yes" type="button">✓ JA</button><button class="no" type="button">✗</button>`;
  ov.querySelector(".no").onclick = e => { e.stopPropagation(); ov.remove(); };
  ov.querySelector(".yes").onclick = e => {
    e.stopPropagation();
    el.classList.add("bye");
    const key = playedKeyFor(c.label, played);
    const ex = played.find(p => p.key === key);
    // Bestehender Eintrag behält seinen Namen; ein fehlender Künstler wird ergänzt
    const label = ex ? ex.label : c.label;
    const artist = ex && ex.artist ? ex.artist : (c.artist || "");
    setTimeout(() => backend && backend.markPlayed(c, key, label, artist), 420);
  };
  el.querySelector(".face").appendChild(ov);
  setTimeout(() => ov.isConnected && ov.remove(), 6000);
}

// ---------- Effekte: AUTO / VOLL / SPAR ----------
const FX_KEY = "songwunsch_fx";
const fxModes = ["auto", "high", "low"];
const fxNames = { auto: "AUTO", high: "VOLL", low: "SPARSAM" };
let fxMode = localStorage.getItem(FX_KEY) || config.effects || "auto";
if (!fxModes.includes(fxMode)) fxMode = "auto";
let autoLite = false;
function applyFx() {
  const lite = fxMode === "low" || (fxMode === "auto" && autoLite);
  document.body.classList.toggle("lite", lite);
  $("fx").textContent = "⚡ EFFEKTE: " + fxNames[fxMode] + (fxMode === "auto" ? (lite ? " (SPARSAM)" : " (VOLL)") : "");
}
$("fx").onclick = () => {
  fxMode = fxModes[(fxModes.indexOf(fxMode) + 1) % fxModes.length];
  try { localStorage.setItem(FX_KEY, fxMode); } catch {}
  applyFx();
};
// Automatik (nur im Modus AUTO): erst nach 10 s messen, und nur bei dauerhaft starkem Ruckeln reduzieren
(function watchFps() {
  let frames = 0, t0 = performance.now() + 10000, slow = 0;
  function tick(t) {
    if (t >= t0) {
      frames++;
      if (t - t0 >= 4000) {
        const fps = frames * 1000 / (t - t0);
        frames = 0; t0 = t;
        if (document.visibilityState === "visible" && fxMode === "auto") {
          slow = fps < 28 ? slow + 1 : 0;
          if (!autoLite && slow >= 3) { autoLite = true; applyFx(); }
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
applyFx();

// ---------- Steuerung ----------
$("fs").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};
function armed(btn, label, action) {
  let t = null;
  btn.onclick = () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed"); btn.textContent = "SICHER? NOCHMAL KLICKEN";
      t = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = label; }, 3500);
      return;
    }
    clearTimeout(t); btn.classList.remove("armed"); btn.textContent = label;
    action();
  };
}
armed($("reset"), "↺ ALLE WÜNSCHE LÖSCHEN", () => backend && backend.remove(current.flatMap(c => c.ids)));
armed($("resetRank"), "🏆 RANGLISTE LÖSCHEN", () => backend && backend.resetPlayed(played.map(p => p.key)));

// ---------- Start ----------
try {
  backend = await initBackend();
  if (backend.demo) {
    const d = document.createElement("div");
    d.className = "demo-banner";
    d.textContent = "DEMO-MODUS – Firebase noch nicht eingerichtet (siehe ANLEITUNG)";
    document.body.appendChild(d);
    document.body.classList.add("demo");
  }
  // Rangliste zuerst laden, damit "gespielt" sofort den richtigen Eintrag findet
  backend.subscribePlayed(list => { played = list; renderRanking(); });
  backend.subscribe(reqs => render(clusterRequests(reqs)));
} catch (e) {
  $("empty").querySelector(".big").textContent = "KEINE VERBINDUNG – config.js prüfen";
}
</script>
