<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Songwunsch · HOST</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden; height: 100vh; }
  .wrap { position: relative; z-index: 2; height: 100vh; display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 22px 24px; }

  body.demo .wrap { height: calc(100vh - 26px); }
  /* ---------- Hauptbereich ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { position: relative; z-index: 3; display: flex; align-items: baseline; gap: 22px; margin-bottom: 18px; flex-wrap: wrap; pointer-events: none; }
  .top h1 { margin: 0; font-size: clamp(22px, 2.6vw, 40px); letter-spacing: 3px; }
  .top .party { font-family: var(--pixel); font-size: 13px; letter-spacing: 2px; }
  .board { position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: -46px -30px 0; padding: 112px 40px 16px; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .tiles { --row: 118px; --col: 240px; display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(var(--col), 1fr)); grid-auto-rows: var(--row); grid-auto-flow: dense; }

  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
  .empty .big { font-family: var(--pixel); font-size: clamp(18px, 2.4vw, 34px); }
  .empty .small { font-size: 30px; color: #c7b5ef; }

  /* ---------- Song-Box: Retro-Spielmodul ---------- */
  .box { position: relative; grid-column: span 1; grid-row: span 1; cursor: pointer; contain: layout style; }
  .box.s2 { grid-column: span 2; }
  .box.s3 { grid-column: span 2; grid-row: span 2; }
  .box.s4 { grid-column: span 3; grid-row: span 2; }

  /* Gehäuse */
  .face { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 17px 8px 11px; color: var(--ink);
    background: linear-gradient(180deg, rgba(255,255,255,.16), transparent 30%, rgba(0,0,0,.18)), var(--body);
    border-radius: 8px 8px 4px 4px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -7px 0 rgba(0,0,0,.35), inset 3px 0 0 rgba(255,255,255,.08),
      0 8px 0 rgba(0,0,0,.45), 0 0 22px var(--glow); }
  /* Griffrillen oben */
  .face::before { content: ""; position: absolute; top: 5px; left: 16%; right: 16%; height: 8px;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.4) 0 3px, rgba(255,255,255,.12) 3px 4px, transparent 4px 8px); border-radius: 2px; }
  /* Kerben unten */
  .face .notch { position: absolute; bottom: 3px; width: 18px; height: 5px; background: rgba(0,0,0,.45); border-radius: 2px 2px 0 0; }
  .face .notch.l { left: 12px; } .face .notch.r { right: 12px; }

  /* Etikett */
  .label { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
    padding: 15px 12px 5px; background: var(--label); border-radius: 4px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.2); }
  /* 80er-Streifen oben auf dem Etikett */
  .label::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px;
    background: linear-gradient(90deg, #ffe45e 0 20%, #ff8a3d 20% 40%, #ff2fb9 40% 60%, #9d4dff 60% 80%, #2de2ff 80%); opacity: .95; }
  .label .tag { position: absolute; top: 9px; left: 11px; font-family: var(--pixel); font-size: 7px; letter-spacing: 1px; opacity: .7; z-index: 3; }
  .label .title { position: relative; z-index: 3; font-family: var(--term); font-size: var(--fs, 34px); line-height: .95; margin-top: 4px;
    overflow-wrap: normal; word-break: normal; }
  .label .artist { position: relative; z-index: 3; font-size: calc(var(--fs, 34px) * .55); opacity: .78; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box.s3 .face, .box.s4 .face { padding: 26px 14px 18px; }
  .box.s3 .face::before, .box.s4 .face::before { top: 8px; height: 11px; }
  .box.s3 .label, .box.s4 .label { padding: 18px 22px 12px; }
  .box.s3 .label .tag, .box.s4 .label .tag { font-size: 10px; top: 14px; left: 18px; }
  .box.s3 .label::before, .box.s4 .label::before { height: 9px; }

  /* Münze mit Anzahl */
  .badge { position: absolute; z-index: 6; top: -22px; right: -16px; width: 58px; height: 58px; pointer-events: none; }
  .badge[hidden] { display: none; }
  .coin { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    display: flex; align-items: baseline; justify-content: center; padding-top: 17px; gap: 1px;
    font-family: var(--pixel); color: #5a3300; text-shadow: 1px 1px 0 rgba(255,255,255,.55);
    background: radial-gradient(circle at 35% 28%, #fffbd0 0 14%, #ffd23f 42%, #e09a00 78%, #a86a00 100%);
    border: 3px solid #7a4600; box-shadow: 0 4px 0 #4a2800, inset 0 0 0 3px rgba(255,255,255,.35);
    animation: wobble 1.8s ease-in-out infinite alternate; will-change: transform; }
  .coin .bx { font-size: 10px; }
  .coin .bn { font-size: 18px; }
  /* Glanzstreifen, der über die Münze huscht */
  .coin::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 35%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); transform: translateX(0) rotate(20deg);
    animation: shine 2.6s ease-in-out infinite; will-change: transform; }
  @keyframes wobble { from { transform: rotate(-10deg) scale(1); } to { transform: rotate(10deg) scale(1.08); } }
  @keyframes shine { 0%, 55% { transform: translateX(0) rotate(20deg); } 100% { transform: translateX(560%) rotate(20deg); } }
  /* Strahlenkranz hinter der Münze */
  .rays { position: absolute; inset: -18px; border-radius: 50%; z-index: -1; opacity: .75;
    background: repeating-conic-gradient(from 0deg, rgba(255,228,94,.85) 0 10deg, transparent 10deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 38%, #000 40%, #000 62%, transparent 72%);
            mask: radial-gradient(circle, transparent 38%, #000 40%, #000 62%, transparent 72%);
    animation: spin 6s linear infinite; will-change: transform; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Größere Boxen = größere Münze */
  .box.s3 .badge, .box.s4 .badge { width: 78px; height: 78px; top: -30px; right: -22px; }
  .box.s3 .coin, .box.s4 .coin { padding-top: 23px; border-width: 4px; }
  .box.s3 .coin .bx, .box.s4 .coin .bx { font-size: 13px; }
  .box.s3 .coin .bn, .box.s4 .coin .bn { font-size: 26px; }
  /* Ab Flammen: glühende Feuer-Münze */
  .box.fire .coin { color: #fff; text-shadow: 2px 2px 0 #7a0016;
    background: radial-gradient(circle at 35% 28%, #fff4b0 0 12%, #ffb13d 35%, #ff3d3d 70%, #8a0020 100%);
    border-color: #5a0010; box-shadow: 0 4px 0 #3a000a, inset 0 0 0 3px rgba(255,255,255,.3), 0 0 22px rgba(255,80,20,.9);
    animation-duration: .9s; }
  .box.fire .rays { background: repeating-conic-gradient(from 0deg, rgba(255,120,30,.95) 0 12deg, rgba(255,228,94,.6) 12deg 18deg, transparent 18deg 30deg);
    animation-duration: 2.5s; inset: -26px; opacity: 1; }
  .box.s4 .badge { width: 92px; height: 92px; top: -36px; right: -26px; }
  .box.s4 .coin { padding-top: 27px; } .box.s4 .coin .bn { font-size: 32px; }
  /* Neue Stimme: Münze springt und dreht sich */
  .box.bump .badge { animation: coinpop .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes coinpop { 0% { transform: scale(1) rotateY(0); } 40% { transform: scale(1.7) rotateY(180deg); } 100% { transform: scale(1) rotateY(360deg); } }

  /* Varianten: Gehäusefarbe + Etikett */
  .th0 { --body: #3a3550; --label: linear-gradient(180deg, #ffe45e, #ff8a3d 55%, #ff2fb9); --ink: #2a0849; --glow: rgba(255,47,185,.35); }
  .th1 { --body: #6c2bd9; --label: #0b0221; --ink: #2de2ff; --glow: rgba(157,77,255,.45); }
  .th1 .label { background-image: linear-gradient(rgba(45,226,255,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(45,226,255,.13) 1px, transparent 1px); background-size: 16px 16px; }
  .th1 .title { text-shadow: 0 0 8px rgba(45,226,255,.7); }
  .th2 { --body: #ff2fb9; --label: #fff3d6; --ink: #2a0849; --glow: rgba(255,47,185,.45); }
  .th3 { --body: #17a9cc; --label: #0d1b6e; --ink: #ffe45e; --glow: rgba(45,226,255,.4); }
  .th3 .title { text-shadow: 2px 2px 0 #ff2fb9; }
  .th4 { --body: #ff9a2e; --label: #1a0638; --ink: #ff6fd0; --glow: rgba(255,138,61,.45); }
  .th4 .title { text-shadow: 0 0 8px rgba(255,47,185,.7); }
  .th5 { --body: #a7abbd; --label: #111; --ink: #fff; --glow: rgba(200,210,255,.3); }
  .th5 .title { background: linear-gradient(180deg, #fff 0%, #b3f3ff 45%, #2de2ff 50%, #ff8fe0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .th6 { --body: #1f9e64; --label: #031a0c; --ink: #39ff88; --glow: rgba(57,255,136,.35); }
  .th6 .title::before { content: "> "; }
  .th6 .label { background-image: repeating-linear-gradient(180deg, rgba(57,255,136,.07) 0 2px, transparent 2px 4px); }
  .th7 { --body: #e8344e; --label: #f4ecff; --ink: #1a0638; --glow: rgba(255,77,109,.4); }

  /* Animationen (nur transform/opacity = flüssig) */
  .box.new { animation: spawn .55s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes spawn { 0% { transform: translateY(-40px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .box.new .face::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #fff; animation: flash .45s ease-out forwards; z-index: 7; pointer-events: none; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .box.bump { animation: bump .45s ease-out; }
  @keyframes bump { 30% { transform: scale(1.06); } 100% { transform: none; } }
  .plusone { position: absolute; z-index: 9; right: 30px; top: 8px; font-family: var(--pixel); font-size: 20px; color: var(--yellow);
    text-shadow: 2px 2px 0 var(--pink); animation: floatup 1.1s ease-out forwards; pointer-events: none; will-change: transform, opacity; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }
  .box.bye { animation: bye .4s ease-in forwards; }
  @keyframes bye { 40% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(.2); opacity: 0; } }

  /* ---------- Flammen ---------- */
  .box.fire .face { --glow: rgba(255, 110, 30, .9); }
  /* pulsierendes Glühen: fester Schatten, nur Deckkraft animiert */
  .heat { position: absolute; inset: -18px -14px -10px; border-radius: 18px; z-index: -1; pointer-events: none; display: none;
    background: radial-gradient(ellipse at 50% 70%, rgba(255,140,30,.7), rgba(255,40,60,.35) 55%, transparent 78%);
    box-shadow: 0 0 50px 18px rgba(255, 80, 20, .6); animation: heat .7s ease-in-out infinite alternate; will-change: opacity; }
  .box.fire .heat { display: block; }
  @keyframes heat { from { opacity: .45; } to { opacity: 1; } }
  /* Glut im Etikett */
  .embers { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .embers i { position: absolute; bottom: -35%; width: 28%; height: 85%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 85%, rgba(255,240,140,.9) 0%, rgba(255,140,40,.6) 28%, rgba(255,40,80,.28) 50%, transparent 68%);
    animation: rise 1.1s ease-in infinite; opacity: 0; will-change: transform, opacity; }
  @keyframes rise { 0% { transform: translate3d(0, 20%, 0) scale(1); opacity: 0; } 20% { opacity: .95; }
    100% { transform: translate3d(0, -80%, 0) scale(.35); opacity: 0; } }
  /* Flammenzungen oben (zwei Ebenen) + an den Seiten */
  .flames { position: absolute; inset: 0; pointer-events: none; display: none; }
  .box.fire .flames { display: block; }
  .tongues { position: absolute; left: 2%; right: 2%; top: -80px; height: 92px; z-index: 4; }
  .tongues.back { top: -104px; height: 116px; left: -3%; right: -3%; z-index: 3; opacity: .85; }
  .tongues.side-l, .tongues.side-r { top: 8%; bottom: 8%; height: auto; width: 46px; left: auto; right: auto; z-index: 3; }
  .tongues.side-l { left: -34px; }
  .tongues.side-r { right: -34px; }
  .tongues b { position: absolute; bottom: 0; width: 13%; height: 100%;
    background: linear-gradient(0deg, #ff2f4a 0%, #ff6a2a 25%, #ff9d3d 50%, #ffe45e 78%, #fffbd0 92%, transparent 100%);
    clip-path: polygon(50% 0, 66% 28%, 84% 18%, 92% 55%, 100% 100%, 0 100%, 8% 52%, 18% 24%, 34% 36%);
    transform-origin: 50% 100%; animation: lick .42s steps(3) infinite alternate; will-change: transform; }
  .tongues.back b { background: linear-gradient(0deg, #b0002a 0%, #ff2f4a 35%, #ff6a2a 70%, transparent 100%); width: 15%; }
  .tongues.side-l b, .tongues.side-r b { width: 100%; height: 28%; left: 0 !important;
    background: linear-gradient(90deg, transparent, #ffe45e 20%, #ff8a3d 55%, #ff2f4a 100%);
    clip-path: polygon(0 50%, 30% 20%, 45% 35%, 100% 0, 100% 100%, 45% 65%, 30% 80%);
    transform-origin: 100% 50%; animation-name: licks; }
  .tongues.side-r b { background: linear-gradient(270deg, transparent, #ffe45e 20%, #ff8a3d 55%, #ff2f4a 100%);
    clip-path: polygon(100% 50%, 70% 20%, 55% 35%, 0 0, 0 100%, 55% 65%, 70% 80%); transform-origin: 0 50%; }
  @keyframes lick { 0% { transform: scaleY(.5) skewX(-8deg); } 100% { transform: scaleY(1.1) skewX(8deg); } }
  @keyframes licks { 0% { transform: scaleX(.45); } 100% { transform: scaleX(1.05); } }
  /* Funken, die nach oben fliegen */
  .sparks { position: absolute; left: 0; right: 0; top: 0; height: 0; z-index: 5; }
  .sparks s { position: absolute; top: 0; width: 6px; height: 6px; background: #ffe45e; box-shadow: 0 0 6px #ff8a3d;
    animation: spark 1.6s ease-out infinite; opacity: 0; will-change: transform, opacity; }
  .sparks s:nth-child(3n) { background: #fff; width: 4px; height: 4px; }
  .sparks s:nth-child(4n) { background: #ff6a2a; }
  @keyframes spark { 0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0; } 10% { opacity: 1; }
    100% { transform: translate3d(var(--dx, 0), -170px, 0) scale(.3) rotate(180deg); opacity: 0; } }
  /* Große Feuer-Boxen: noch mehr */
  .box.s3.fire .tongues, .box.s4.fire .tongues { top: -110px; height: 124px; }
  .box.s3.fire .tongues.back, .box.s4.fire .tongues.back { top: -142px; height: 156px; }
  .box.s4.fire .tongues b { animation-duration: .32s; }
  .box.s4.fire .heat { box-shadow: 0 0 80px 30px rgba(255, 70, 20, .7); }

  /* Gespielt-Bestätigung */
  .confirm { position: absolute; inset: 0; z-index: 8; border-radius: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    background: rgba(7, 1, 26, .9); font-family: var(--pixel); font-size: 11px; color: #fff; padding: 8px; text-align: center; }
  .confirm button { font-family: var(--pixel); font-size: 11px; border: 0; padding: 10px 12px; cursor: pointer; }
  .confirm .yes { background: var(--green); color: #04220f; box-shadow: 0 4px 0 #128a43; }
  .confirm .no { background: #4a2a7a; color: #fff; box-shadow: 0 4px 0 #24123f; }

  /* ---------- Seitenleiste ---------- */
  .side { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  .qrbox { padding: 20px 18px 18px; text-align: center; }
  .qrbox .scan { font-family: var(--pixel); font-size: 16px; letter-spacing: 2px; margin-bottom: 14px; }
  .qr { background: #fff; padding: 12px; display: inline-block; line-height: 0; box-shadow: 6px 6px 0 var(--pink); }
  .qr svg, .qr img { width: 220px; height: 220px; image-rendering: pixelated; }
  .qrbox .cta { font-family: var(--pixel); font-size: 10px; line-height: 1.7; margin-top: 18px; }
  .qrbox .url { font-size: 19px; color: #c7b5ef; margin-top: 10px; word-break: break-all; line-height: 1; }
  .stats { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
  .stats .n { font-family: var(--pixel); font-size: 24px; }
  .stats .l { font-family: var(--pixel); font-size: 8px; color: #b9a8dd; margin-top: 8px; letter-spacing: 1px; }
  .ctrl { margin-top: auto; display: grid; gap: 10px; opacity: .35; transition: opacity .3s; }
  .ctrl:hover { opacity: 1; }
  .ctrl .help { font-size: 18px; color: #b9a8dd; text-align: center; line-height: 1; }
  .ctrl button { font-family: var(--pixel); font-size: 10px; letter-spacing: 1px; padding: 11px; border: 2px solid var(--purple); background: rgba(17,4,40,.9); color: #fff; cursor: pointer; }
  .ctrl button:hover { border-color: var(--cyan); }
  .ctrl button.danger.armed { background: var(--hot); border-color: #fff; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    .wrap { grid-template-columns: 1fr; height: auto; }
    .board { overflow: visible; }
    .tiles { --col: 160px; }
    .box.s4 { grid-column: span 2; }
  }
</style>
</head>
<body>
<div class="scene"><div class="stars"></div><div class="sun"></div><div class="horizon"></div><div class="grid"></div></div>
<div class="scanlines"></div><div class="vignette"></div>

<div class="wrap">
  <section class="stage">
    <div class="top">
      <h1 class="chrome" id="title">★ SONG REQUESTS ★</h1>
    </div>
    <div class="board" id="board">
      <div class="tiles" id="tiles"></div>
      <div class="empty" id="empty">
        <div class="big neon-p">WAITING FOR PLAYERS<span class="blink">_</span></div>
        <div class="small">QR-Code scannen und den ersten Song wünschen!</div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="qrbox pixel-box">
      <div class="scan neon-y">SCAN ME!</div>
      <div class="qr" id="qr"></div>
      <div class="cta neon-c">SONG WÜNSCHEN<br>OHNE ANMELDUNG</div>
      <div class="url" id="url"></div>
    </div>
    <div class="stats pixel-box">
      <div><div class="n neon-p" id="nReq">0</div><div class="l">WÜNSCHE</div></div>
      <div><div class="n neon-c" id="nSongs">0</div><div class="l">SONGS</div></div>
    </div>
    <div class="ctrl">
      <div class="help">Box anklicken = als gespielt entfernen</div>
      <button id="fs" type="button">⛶ VOLLBILD</button>
      <button id="reset" class="danger" type="button">↺ ALLES LÖSCHEN</button>
    </div>
  </aside>
</div>

<script src="config.js"></script>
<script src="qrcode.js"></script>
<script type="module">
import { config, initBackend, clusterRequests, hash, esc } from "./app.js";

const $ = id => document.getElementById(id);
$("title").textContent = "★ " + config.partyName + " ★";

// ---------- QR-Code zur Gäste-Seite ----------
const guestUrl = new URL("./", location.href).href;
$("url").textContent = guestUrl.replace(/^https?:\/\//, "").replace(/\/$/, "");
try {
  const qr = qrcode(0, "M");
  qr.addData(guestUrl);
  qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
} catch (e) { $("qr").textContent = "QR-Fehler"; }

// ---------- Rendering ----------
const tiles = $("tiles");
const nodes = new Map();          // cluster-id -> { el, count }
let current = [];
let backend = null;
let firstRender = true;

function sizeClass(n) {
  if (n >= 8) return "s4";
  if (n >= 3) return "s3";
  if (n === 2) return "s2";
  return "s1";
}

function makeBox(c) {
  const el = document.createElement("div");
  el.className = "box";
  el.dataset.id = c.id;
  el.innerHTML = `<div class="heat"></div>
    <div class="flames"><div class="tongues back"></div><div class="tongues side-l"></div><div class="tongues side-r"></div><div class="tongues front"></div><div class="sparks"></div></div>
    <div class="face"><div class="label"><div class="embers"></div><div class="tag"></div><div class="title"></div><div class="artist"></div></div><span class="notch l"></span><span class="notch r"></span></div>
    <div class="badge" hidden><div class="rays"></div><div class="coin"><span class="bx">x</span><span class="bn"></span></div></div>`;
  const fill = (sel, n, fn) => { const box = el.querySelector(sel); for (let i = 0; i < n; i++) { const e = document.createElement(sel === ".sparks" ? "s" : "b"); fn(e, i, n); box.appendChild(e); } };
  const flick = (e, i) => { e.style.animationDelay = (-(i * 0.13) % 0.42).toFixed(2) + "s"; e.style.animationDuration = (0.32 + (i % 4) * 0.07).toFixed(2) + "s"; };
  fill(".tongues.back", 6, (e, i, n) => { e.style.left = (i * (100 / n) - 2) + "%"; flick(e, i + 3); });
  fill(".tongues.front", 10, (e, i, n) => { e.style.left = (i * (100 / n) - 1) + "%"; flick(e, i); });
  fill(".tongues.side-l", 4, (e, i) => { e.style.top = (i * 25) + "%"; flick(e, i + 1); });
  fill(".tongues.side-r", 4, (e, i) => { e.style.top = (i * 25) + "%"; flick(e, i + 2); });
  fill(".sparks", 10, (e, i) => {
    e.style.left = (4 + (i * 37) % 92) + "%";
    e.style.setProperty("--dx", (((i * 53) % 80) - 40) + "px");
    e.style.animationDelay = ((i * 0.23) % 1.6).toFixed(2) + "s";
    e.style.animationDuration = (1.2 + (i % 5) * 0.18).toFixed(2) + "s";
  });
  const em = el.querySelector(".embers");
  for (let i = 0; i < 8; i++) {
    const s = document.createElement("i");
    s.style.left = (i * 13 - 8) + "%";
    s.style.animationDelay = (i * 0.23 % 1.1).toFixed(2) + "s";
    s.style.animationDuration = (0.9 + (i % 4) * 0.15).toFixed(2) + "s";
    em.appendChild(s);
  }
  el.addEventListener("click", ev => onBoxClick(el, ev));
  return el;
}

function updateBox(el, c, rank) {
  const fire = c.count >= config.flameAt;
  const theme = "th" + (hash(c.id) % 8);
  el.className = `box ${theme} ${sizeClass(c.count)}${fire ? " fire" : ""}` +
    (el.classList.contains("new") ? " new" : "") + (el.classList.contains("bump") ? " bump" : "");
  el.querySelector(".tag").textContent = (fire ? "🔥 ON FIRE · " : "") + "TRACK " + String(rank).padStart(2, "0");
  el.querySelector(".title").textContent = c.label;
  const ar = el.querySelector(".artist");
  ar.textContent = c.artist || "";
  ar.hidden = !c.artist;
  const badge = el.querySelector(".badge");
  badge.hidden = c.count < 2;
  el.querySelector(".coin .bn").textContent = c.count;
  el.querySelector(".embers").hidden = !fire;
}

function render(list) {
  current = list;
  $("empty").style.display = list.length ? "none" : "flex";
  $("nReq").textContent = list.reduce((s, c) => s + c.count, 0);
  $("nSongs").textContent = list.length;

  const seen = new Set();
  list.forEach((c, i) => {
    seen.add(c.id);
    let n = nodes.get(c.id);
    if (!n) {
      const el = makeBox(c);
      if (!firstRender) { el.classList.add("new"); setTimeout(() => el.classList.remove("new"), 700); }
      n = { el, count: c.count };
      nodes.set(c.id, n);
    } else if (c.count > n.count) {
      n.el.classList.remove("bump"); void n.el.offsetWidth; n.el.classList.add("bump");
      setTimeout(() => n.el.classList.remove("bump"), 750);
      const p = document.createElement("div");
      p.className = "plusone"; p.textContent = "+" + (c.count - n.count);
      n.el.appendChild(p); setTimeout(() => p.remove(), 1200);
    }
    n.count = c.count;
    updateBox(n.el, c, i + 1);
  });
  for (const [id, n] of nodes) if (!seen.has(id)) { n.el.remove(); nodes.delete(id); }

  // Reihenfolge nur anfassen, wenn sie sich geändert hat (sonst starten Animationen neu)
  const want = list.map(c => nodes.get(c.id).el);
  const have = Array.from(tiles.children);
  if (want.length !== have.length || want.some((el, i) => el !== have[i])) want.forEach(el => tiles.appendChild(el));
  firstRender = false;
  fit();
}

// Schriftgröße pro Box so anpassen, dass der Titel komplett reinpasst
function fitText(el) {
  const face = el.querySelector(".label"), title = el.querySelector(".title");
  const base = el.classList.contains("s4") ? 74 : el.classList.contains("s3") ? 60 : el.classList.contains("s2") ? 44 : 36;
  let fs = base;
  const over = () => face.scrollHeight > face.clientHeight + 1 || title.scrollWidth > title.clientWidth + 1;
  title.style.setProperty("--fs", fs + "px");
  el.querySelector(".artist").style.setProperty("--fs", fs + "px");
  while (over() && fs > 14) {
    fs -= 2;
    title.style.setProperty("--fs", fs + "px");
    el.querySelector(".artist").style.setProperty("--fs", fs + "px");
  }
}
function fitAll() { tiles.querySelectorAll(".box").forEach(fitText); }

// Wenn es zu viele Boxen werden: alles etwas kleiner machen
function fit() {
  const board = $("board");
  if (window.innerWidth <= 900) { fitAll(); return; }
  const steps = [[118, 240], [100, 210], [86, 180], [74, 160], [64, 140]];
  for (const [r, c] of steps) {
    tiles.style.setProperty("--row", r + "px");
    tiles.style.setProperty("--col", c + "px");
    tiles.style.fontSize = "";
    const cs = getComputedStyle(board);
    const avail = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 10;
    if (tiles.scrollHeight <= avail) break;
  }
  fitAll();
}
document.fonts && document.fonts.ready.then(() => fit());
window.addEventListener("resize", fit);

// ---------- Gespielt markieren ----------
function onBoxClick(el, ev) {
  if (ev.target.closest(".confirm")) return;
  document.querySelectorAll(".confirm").forEach(c => c.remove());
  const c = current.find(x => x.id === el.dataset.id);
  if (!c) return;
  const ov = document.createElement("div");
  ov.className = "confirm";
  ov.innerHTML = `<span>GESPIELT?</span><button class="yes" type="button">✓ JA</button><button class="no" type="button">✗</button>`;
  ov.querySelector(".no").onclick = e => { e.stopPropagation(); ov.remove(); };
  ov.querySelector(".yes").onclick = e => {
    e.stopPropagation();
    el.classList.add("bye");
    setTimeout(() => backend && backend.remove(c.ids), 420);
  };
  el.querySelector(".face").appendChild(ov);
  setTimeout(() => ov.isConnected && ov.remove(), 6000);
}

// ---------- Steuerung ----------
$("fs").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};
let armTimer = null;
$("reset").onclick = () => {
  const b = $("reset");
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "SICHER? NOCHMAL KLICKEN";
    armTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "↺ ALLES LÖSCHEN"; }, 3500);
    return;
  }
  clearTimeout(armTimer);
  b.classList.remove("armed"); b.textContent = "↺ ALLES LÖSCHEN";
  if (backend) backend.remove(current.flatMap(c => c.ids));
};

// ---------- Start ----------
try {
  backend = await initBackend();
  if (backend.demo) {
    const d = document.createElement("div");
    d.className = "demo-banner";
    d.textContent = "DEMO-MODUS – Firebase noch nicht eingerichtet (siehe ANLEITUNG)";
    document.body.appendChild(d);
    document.body.classList.add("demo");
  }
  backend.subscribe(reqs => render(clusterRequests(reqs)));
} catch (e) {
  $("empty").querySelector(".big").textContent = "KEINE VERBINDUNG – config.js prüfen";
}
</script>
